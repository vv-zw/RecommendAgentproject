version: '3.8'

services:
  # ==========================================
  # PostgreSQL 数据库 (含 pgvector 扩展)
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: movie-rec-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres123}
      POSTGRES_DB: ${PGDATABASE:-movie_recommendation}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  # ==========================================
  # Flask 后端服务
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: movie-rec-backend
    restart: unless-stopped
    # 从 .env 文件加载环境变量
    env_file:
      - .env
    environment:
      # 覆盖数据库连接配置（使用容器内网络）
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - DB_ENABLED=true
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-postgres123}
      - PGDATABASE=${PGDATABASE:-movie_recommendation}
      - DATABASE_URL=postgresql://${PGUSER:-postgres}:${PGPASSWORD:-postgres123}@postgres:5432/${PGDATABASE:-movie_recommendation}
    ports:
      - "5001:5001"
    volumes:
      # 数据目录映射（Windows 本地目录 -> 容器内目录）
      - ./data:/app/data
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./movie_recommendation/image_cache:/app/movie_recommendation/image_cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network

  # ==========================================
  # React 前端服务
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: movie-rec-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

# ==========================================
# 数据卷定义
# ==========================================
volumes:
  postgres_data:
    driver: local

# ==========================================
# 网络定义
# ==========================================
networks:
  app-network:
    driver: bridge
